<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impostor Game - Player</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background: #f0f2f5; }
        .card { background: white; padding: 20px; border-radius: 12px; max-width: 400px; margin: 0 auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-size: 16px; }
        button { background: #007bff; color: white; font-weight: bold; border: none; cursor: pointer; }
        .hidden { display: none; }
        .word-box { font-size: 32px; color: #e67e22; font-weight: bold; margin: 15px 0; background: #fff3e0; padding: 15px; border-radius: 8px; }
    </style>
</head>
<body>

    <!-- หน้ากรอกชื่อ -->
    <div class="card" id="login-form">
        <h2>เข้าเล่นเกม</h2>
        <input type="text" id="username" placeholder="ใส่ชื่อของคุณ">
        <button onclick="joinGame()">เข้าห้อง</button>
    </div>

    <!-- หน้าการเล่น -->
    <div class="card hidden" id="game-form">
        <h3 id="player-display"></h3>
        <p>คำศัพท์ลับของคุณคือ:</p>
        <div class="word-box" id="secret-word">รออาจารย์กดเริ่มเกม...</div>
        
        <input type="text" id="answer-input" placeholder="พิมพ์คำใบ้ของคุณ 1 คำ">
        <button id="send-btn" onclick="sendAnswer()">ส่งคำตอบ</button>
    </div>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBO1K6Zc_B2d-NYs56M5SaV8538tpvDJNA",
            authDomain: "imposter-game-f07f2.firebaseapp.com",
            databaseURL: "https://imposter-game-f07f2-default-rtdb.firebaseio.com",
            projectId: "imposter-game-f07f2",
            storageBucket: "imposter-game-f07f2.firebasestorage.app",
            messagingSenderId: "313788342489",
            appId: "1:313788342489:web:587a03eea181cf929a5ec8"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        let playerName = "";
        let playerRef = null;

        function joinGame() {
            playerName = document.getElementById('username').value;
            if(!playerName) return alert('กรุณากรอกชื่อ');

            playerRef = db.ref('players').push({ name: playerName });

            document.getElementById('login-form').classList.add('hidden');
            document.getElementById('game-form').classList.remove('hidden');
            document.getElementById('player-display').innerText = "ผู้เล่น: " + playerName;

            // รอรับคำศัพท์ลับจาก Host
            playerRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (data && data.assignedWord) {
                    document.getElementById('secret-word').innerText = data.assignedWord;
                }
            });
        }

        function sendAnswer() {
            const word = document.getElementById('answer-input').value;
            if(!word) return alert('กรุณาพิมพ์คำตอบ');

            db.ref('answers').push({
                name: playerName,
                word: word
            });

            document.getElementById('send-btn').disabled = true;
            document.getElementById('send-btn').innerText = "ส่งคำตอบแล้ว!";
        }
    </script>
</body>
</html>
