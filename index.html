<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Who is Impostor? - Player</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); margin-bottom: 15px; box-sizing: border-box; }
        input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: none; font-size: 16px; box-sizing: border-box; }
        input { background: #2a2a2a; color: #fff; }
        button { background: #ff4757; color: white; font-weight: bold; cursor: pointer; }
        .role-box { background: #2d3436; padding: 15px; border-radius: 8px; margin-top: 10px; border: 2px solid #ff4757; }
        .word { font-size: 24px; color: #2ed573; font-weight: bold; margin-top: 5px; }
        .impostor-text { font-size: 20px; color: #ff4757; font-weight: bold; margin-top: 5px; }
        .list-title { font-size: 18px; font-weight: bold; margin-bottom: 10px; color: #eccc68; text-align: left; }
        .player-item { background: #2a2a2a; padding: 10px 15px; border-radius: 8px; margin-bottom: 8px; text-align: left; display: flex; justify-content: space-between; align-items: center; }
        .player-name { font-weight: bold; color: #70a1ff; }
        .player-answer { color: #ffffff; background: #333; padding: 4px 8px; border-radius: 4px; font-size: 14px; }
        .no-ans { color: #888; font-style: italic; }
        .reveal-box { background: #ffa502; color: #000; padding: 15px; border-radius: 8px; font-weight: bold; margin-bottom: 15px; display: none; }
    </style>
</head>
<body>

    <div class="card" id="loginCard">
        <h2>🕵️‍♂️ Who is Impostor?</h2>
        <input type="text" id="playerName" placeholder="ใส่ชื่อของคุณที่นี่...">
        <button onclick="joinGame()">เข้าร่วมเกม</button>
    </div>

    <div class="card" id="gameCard" style="display: none;">
        <h3 id="welcomeText"></h3>
        
        <div id="revealCard" class="reveal-box">
            📢 <b>เฉลยเกม!</b><br>
            <span id="revealDetail"></span>
        </div>

        <div class="role-box">
            <div>บทบาทของคุณ:</div>
            <div id="roleDisplay">รอ Host เริ่มเกม...</div>
        </div>

        <div id="answerSection" style="margin-top: 20px; display: none;">
            <label><b>ส่งคำใบ้ของคุณ:</b></label>
            <input type="text" id="myAnswer" placeholder="พิมพ์คำตอบของคุณ...">
            <button onclick="sendAnswer()" style="background: #2ed573;">ส่งคำตอบ</button>
        </div>
    </div>

    <div class="card" id="playersCard" style="display: none;">
        <div class="list-title">👥 คำตอบของทุกคนในห้อง:</div>
        <div id="playersList"></div>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://imposter-game-f07f2-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let myPlayerKey = "";
        let myName = "";

        function joinGame() {
            const nameInput = document.getElementById("playerName").value.trim();
            if (!nameInput) return alert("กรุณาใส่ชื่อ!");

            myName = nameInput;
            const newRef = db.ref("players").push();
            myPlayerKey = newRef.key;

            newRef.set({
                name: myName,
                role: "",
                word: "",
                answer: "",
                isRevealed: false
            });

            document.getElementById("loginCard").style.display = "none";
            document.getElementById("gameCard").style.display = "block";
            document.getElementById("playersCard").style.display = "block";
            document.getElementById("welcomeText").innerText = "สวัสดี: " + myName;

            listenToMyData();
            listenToAllPlayers();
            listenToGameStatus();
        }

        function listenToMyData() {
            db.ref("players/" + myPlayerKey).on("value", snapshot => {
                const data = snapshot.val();
                if (!data) return;

                const roleDiv = document.getElementById("roleDisplay");
                const ansSec = document.getElementById("answerSection");

                if (!data.role) {
                    roleDiv.innerHTML = "<i>รอ Host สุ่มบทบาท...</i>";
                    ansSec.style.display = "none";
                } else if (data.role === "Civilian") {
                    roleDiv.innerHTML = `คุณคือ <b style="color:#2ed573">Civilian</b><div class="word">คำของคุณคือ: ${data.word}</div>`;
                    ansSec.style.display = "block";
                } else if (data.role === "Impostor") {
                    roleDiv.innerHTML = `คุณคือ <b style="color:#ff4757">Impostor 😈</b><div class="impostor-text">คำของคุณคือ: ${data.word}</div>`;
                    ansSec.style.display = "block";
                }
            });
        }

        function sendAnswer() {
            const ans = document.getElementById("myAnswer").value.trim();
            if (!ans) return alert("กรุณาพิมพ์คำตอบ!");

            db.ref("players/" + myPlayerKey).update({ answer: ans });
            alert("ส่งคำตอบเรียบร้อย!");
        }

        function listenToAllPlayers() {
            db.ref("players").on("value", snapshot => {
                const players = snapshot.val();
                const listDiv = document.getElementById("playersList");
                listDiv.innerHTML = "";

                if (!players) return;

                Object.keys(players).forEach(key => {
                    const p = players[key];
                    const item = document.createElement("div");
                    item.className = "player-item";

                    let roleTag = "";
                    if (p.isRevealed) {
                        roleTag = p.role === "Impostor" ? " [Impostor]" : " [Civilian]";
                    }

                    const ansText = p.answer ? `<span class="player-answer">${p.answer}</span>` : `<span class="no-ans">ยังไม่ส่งคำตอบ</span>`;

                    item.innerHTML = `<div><span class="player-name">${p.name}</span><small style="color:#ff6b6b">${roleTag}</small></div> ${ansText}`;
                    listDiv.appendChild(item);
                });
            });
        }

        function listenToGameStatus() {
            db.ref("gameState").on("value", snapshot => {
                const state = snapshot.val();
                const revealCard = document.getElementById("revealCard");
                const revealDetail = document.getElementById("revealDetail");

                if (state && state.isRevealed) {
                    revealCard.style.display = "block";
                    revealDetail.innerHTML = `คำศัพท์คือ: <b>${state.secretWord}</b><br>Impostor คือ: <b style="color:#d63031">${state.impostorName}</b>`;
                } else {
                    revealCard.style.display = "none";
                }
            });
        }
    </script>
</body>
</html>
