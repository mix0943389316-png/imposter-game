<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Who is Impostor? - Host Screen</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 30px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 900px; text-align: center; }
        h1 { color: #38bdf8; margin-bottom: 10px; }
        .card { background: #1e293b; border-radius: 16px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); margin-bottom: 25px; border: 1px solid #334155; }
        .category-select { font-size: 18px; padding: 10px; border-radius: 8px; background: #0f172a; color: #fff; border: 1px solid #475569; width: 60%; margin-bottom: 15px; }
        .btn { border: none; padding: 12px 24px; font-size: 18px; font-weight: bold; border-radius: 10px; cursor: pointer; margin: 5px; transition: all 0.2s; }
        .btn-start { background: #22c55e; color: white; }
        .btn-reveal { background: #eab308; color: black; }
        .btn-reset { background: #ef4444; color: white; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; margin-top: 20px; text-align: left; }
        .player-card { background: #334155; padding: 15px; border-radius: 12px; border-left: 5px solid #94a3b8; }
        .player-card.impostor { border-left-color: #ef4444; background: #451a03; }
        .player-card.civilian { border-left-color: #22c55e; }
        .p-name { font-size: 20px; font-weight: bold; color: #f8fafc; }
        .p-role { font-size: 14px; margin-top: 5px; }
        .p-answer { margin-top: 10px; background: #0f172a; padding: 8px; border-radius: 6px; font-size: 15px; color: #e2e8f0; }
        .secret-info { background: #0284c7; padding: 15px; border-radius: 10px; margin-top: 15px; font-size: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎮 Host Dashboard (ผู้ดำเนินเกม)</h1>
        
        <div class="card">
            <label for="catSelect"><b>เลือกหมวดหมู่คำศัพท์:</b></label><br>
            <select id="catSelect" class="category-select">
                <option value="animals">🐾 สัตว์เลี้ยง / สัตว์ป่า</option>
                <option value="food">🍕 อาหาร / เครื่องดื่ม</option>
                <option value="places">🏫 สถานที่</option>
            </select>
            <br>
            <button class="btn btn-start" onclick="startGame()">▶️ สุ่มบทบาท & เริ่มเกม</button>
            <button class="btn btn-reveal" onclick="revealGame()">🎉 เฉลยผล</button>
            <button class="btn btn-reset" onclick="resetGame()">🔄 รีเซ็ตเกมทั้งหมด</button>
            
            <div id="secretBox" class="secret-info" style="display:none;"></div>
        </div>

        <div class="card">
            <h2>👥 รายชื่อผู้เล่น (<span id="playerCount">0</span> คน)</h2>
            <div id="playersGrid" class="grid">
                <div style="color:#94a3b8; grid-column: 1/-1;">ยังไม่มีผู้เล่นเข้าร่วม...</div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://imposter-game-f0712-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const wordBank = {
            animals: ["สุนัข", "แมว", "ช้าง", "เสือ", "ลิง", "เพนกวิน", "แพนด้า", "จระเข้"],
            food: ["ส้มตำ", "ชาบู", "พิซซ่า", "ก๋วยเตี๋ยว", "ชานมไข่มุก", "ข้าวผัด", "ไอศกรีม"],
            places: ["โรงเรียน", "โรงพยาบาล", "ห้างสรรพสินค้า", "สวนสนุก", "สนามบิน", "ชายหาด"]
        };

        let currentImpostorKey = "";
        let currentSecretWord = "";
        let currentImpostorName = "";

        // ฟังข้อมูลผู้เล่นตลอดเวลา
        db.ref("players").on("value", snapshot => {
            const players = snapshot.val();
            const grid = document.getElementById("playersGrid");
            const countSpan = document.getElementById("playerCount");

            if (!players) {
                grid.innerHTML = `<div style="color:#94a3b8; grid-column: 1/-1;">ยังไม่มีผู้เล่นเข้าร่วม...</div>`;
                countSpan.innerText = "0";
                return;
            }

            const keys = Object.keys(players);
            countSpan.innerText = keys.length;
            grid.innerHTML = "";

            keys.forEach(key => {
                const p = players[key];
                let cardClass = "player-card";
                let roleText = "รอเริ่มเกม...";

                if (p.isRevealed) {
                    if (p.role === "Impostor") {
                        cardClass += " impostor";
                        roleText = "😈 Impostor";
                    } else if (p.role === "Civilian") {
                        cardClass += " civilian";
                        roleText = `😇 Civilian (${p.word})`;
                    }
                } else if (p.role) {
                    roleText = "🎮 กำลังเล่นอยู่...";
                }

                const ansDisplay = p.answer ? p.answer : "<i style='color:#64748b;'>ยังไม่ส่งคำตอบ</i>";

                const card = document.createElement("div");
                card.className = cardClass;
                card.innerHTML = `
                    <div class="p-name">${p.name}</div>
                    <div class="p-role">${roleText}</div>
                    <div class="p-answer"><b>คำตอบ:</b> ${ansDisplay}</div>
                `;
                grid.appendChild(card);
            });
        });

        function startGame() {
            db.ref("players").once("value", snapshot => {
                const players = snapshot.val();
                if (!players) return alert("ยังไม่มีผู้เล่นเข้าร่วม!");

                const keys = Object.keys(players);
                if (keys.length < 2) return alert("ต้องมีผู้เล่นอย่างน้อย 2 คนขึ้นไป");

                const cat = document.getElementById("catSelect").value;
                const words = wordBank[cat];
                currentSecretWord = words[Math.floor(Math.random() * words.length)];

                const impostorIndex = Math.floor(Math.random() * keys.length);
                currentImpostorKey = keys[impostorIndex];
                currentImpostorName = players[currentImpostorKey].name;

                keys.forEach(key => {
                    if (key === currentImpostorKey) {
                        db.ref("players/" + key).update({ role: "Impostor", word: "", answer: "", isRevealed: false });
                    } else {
                        db.ref("players/" + key).update({ role: "Civilian", word: currentSecretWord, answer: "", isRevealed: false });
                    }
                });

                db.ref("gameState").set({ isRevealed: false, secretWord: "", impostorName: "" });
                document.getElementById("secretBox").style.display = "none";
                alert("เริ่มเกมแล้ว! สุ่ม Impostor เรียบร้อย");
            });
        }

        function revealGame() {
            if (!currentSecretWord) return alert("ยังไม่ได้เริ่มเกม!");

            db.ref("players").once("value", snapshot => {
                const players = snapshot.val();
                if (players) {
                    Object.keys(players).forEach(key => {
                        db.ref("players/" + key).update({ isRevealed: true });
                    });
                }
            });

            db.ref("gameState").set({
                isRevealed: true,
                secretWord: currentSecretWord,
                impostorName: currentImpostorName
            });

            const secretBox = document.getElementById("secretBox");
            secretBox.style.display = "block";
            secretBox.innerHTML = `🎉 เฉลย: คำศัพท์คือ [${currentSecretWord}] | Impostor คือ [${currentImpostorName}]`;
        }

        function resetGame() {
            if (confirm("ต้องการลบผู้เล่นและเริ่มใหม่ทั้งหมดใช่หรือไม่?")) {
                db.ref("players").remove();
                db.ref("gameState").remove();
                document.getElementById("secretBox").style.display = "none";
                currentSecretWord = "";
                currentImpostorName = "";
            }
        }
    </script>
</body>
</html>
